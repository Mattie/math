name: Verify publication

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_proof:
        description: Rebuild and audit the complete Lean proof
        type: boolean
        default: false
      independent_proofs:
        description: Rebuild four final statements and check with Comparator and Nanoda
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verification-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: python3 verification/publication/check-frozen.py
      - run: python3 verification/publication/test_verification.py
      - run: python3 verification/irrationality-exponents/test_verify.py
      - run: python3 -B verification/isolated-irrationality/test_verify.py
      - run: python3 -B verification/isolated-quadratic-periods/test_quadratic.py
      - run: python3 verification/publication/test_runner_capacity.py
      - run: python3 verification/publication/check-wrapper-evidence.py
      - run: python3 verification/publication/check-upstream.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
  small-proofs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 formalizations/FlintCooksonHills/check.py
  integrity:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preprint:
          - The-irrationality-exponent-of-real-and-imaginary-quadratic-periods-is-2-October-9-2026
          - The-irrationality-exponent-of-positive-quadratic-logarithms-is-at-most-4-October-8-2026
          - The-weighted-degree-bound-for-monomial-compactifications-holds-at-every-power-October-8-2026
          - The-irrationality-exponent-of-log-3-plus-2-sqrt2-over-sqrt2-is-2-October-7-2026
          - The-irrationality-exponent-of-arctan-sqrt2-over-sqrt2-is-2-October-7-2026
          - The-irrationality-exponent-of-positive-rational-logarithms-is-2-October-7-2026
          - The-irrationality-exponent-of-nonzero-rational-arctangents-is-2-October-7-2026
    defaults:
      run:
        working-directory: preprints/${{ matrix.preprint }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 scripts/check-publication.py
  proof:
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild_proof
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - preprint: The-irrationality-exponent-of-real-and-imaginary-quadratic-periods-is-2-October-9-2026
            verify_script: lean/verify.sh
            fetch_mathlib_cache: true
          - preprint: The-irrationality-exponent-of-positive-quadratic-logarithms-is-at-most-4-October-8-2026
            verify_script: lean/verify.sh
          - preprint: The-weighted-degree-bound-for-monomial-compactifications-holds-at-every-power-October-8-2026
            verify_script: lean/verify.sh
          - preprint: The-irrationality-exponent-of-log-3-plus-2-sqrt2-over-sqrt2-is-2-October-7-2026
            verify_script: lean/verify.sh
          - preprint: The-irrationality-exponent-of-arctan-sqrt2-over-sqrt2-is-2-October-7-2026
            verify_script: lean/verify.sh
          - preprint: The-irrationality-exponent-of-positive-rational-logarithms-is-2-October-7-2026
            verify_script: scripts/verify.sh
          - preprint: The-irrationality-exponent-of-nonzero-rational-arctangents-is-2-October-7-2026
            verify_script: lean/verify.sh
    defaults:
      run:
        working-directory: preprints/${{ matrix.preprint }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install elan
        run: |
          curl --fail --location --silent --show-error https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib cache
        if: matrix.fetch_mathlib_cache == true
        run: |
          cd lean
          lake exe cache get
      - name: Exercise axiom rejection controls
        run: |
          cd lean
          bash ../../../verification/publication/lean-controls.sh ../scripts/check-axioms.py
      - name: Build and audit the proof
        run: |
          mkdir -p .verification
          set -o pipefail
          /usr/bin/time -v bash ${{ matrix.verify_script }} 2>&1 | tee .verification/verification.log
      - name: Check publication after build
        run: python3 scripts/check-publication.py
      - name: Retain fresh verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.preprint }}
          path: preprints/${{ matrix.preprint }}/.verification/*.log
          if-no-files-found: error
          include-hidden-files: true

  independent-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.independent_proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set isolated working directory
        run: echo "PROOF_WORK=$RUNNER_TEMP/independent-proof-verification" >> "$GITHUB_ENV"
      - name: Reserve disk for tools, builds, and retained exports
        run: |
          mkdir -p "$PROOF_WORK"
          set -o pipefail
          bash verification/publication/prepare-independent-runner.sh 2>&1 | tee "$PROOF_WORK/capacity.log"
      - name: Check frozen proof inputs and recorded evidence
        run: |
          python3 verification/publication/check-frozen.py
          python3 verification/publication/check-wrapper-evidence.py
      - name: Rebuild and independently check all four final statements
        run: |
          mkdir -p "$PROOF_WORK"
          df -h "$RUNNER_TEMP"
          set -o pipefail
          /usr/bin/time -v bash verification/irrationality-exponents/run.sh \
            --case all --work-dir "$PROOF_WORK" 2>&1 | tee "$PROOF_WORK/console.log"
      - name: Retain complete receipts and checker logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: independent-proof-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROOF_WORK }}/console.log
            ${{ env.PROOF_WORK }}/capacity.log
            ${{ env.PROOF_WORK }}/runs/*/receipt.json
            ${{ env.PROOF_WORK }}/runs/*/logs/*.log
            ${{ env.PROOF_WORK }}/runs/*/configuration/*
            ${{ env.PROOF_WORK }}/runs/*/*/*.nanoda.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
